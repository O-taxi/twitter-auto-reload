<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Auto Refresher</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <span class="eyebrow">X / TWITTER</span>
        <h1>タイムライン設定</h1>
    </header>
    <main>
        <div class="settings-panel">
            <section class="setting">
                <div class="heading">
                    <h2>自動更新</h2>
                    <div class="controls">
                        <span id="refresh-status" class="badge">停止中</span>
                        <button id="refresh-button" class="icon-button" type="button" aria-label="自動更新を開始する" title="自動更新を開始する" aria-pressed="false">
                            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
                            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="interval-row">
                    <label for="interval">更新間隔</label>
                    <div class="interval-field">
                        <input id="interval" type="number" min="30" step="1" value="60">
                        <span class="hint">秒</span>
                    </div>
                </div>
            </section>
            <section class="setting promotions-setting">
                <div class="heading">
                    <h2>広告の定期削除</h2>
                    <div class="controls">
                        <span id="promotions-status" class="badge">停止中</span>
                        <button id="promotions-button" class="icon-button" type="button" aria-label="広告の定期削除を開始する" title="広告の定期削除を開始する" aria-pressed="false">
                            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
                            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
                        </button>
                    </div>
                </div>
            </section>
        </div>
        <p id="error" role="alert"></p>
    </main>
    <script src="popup.js"></script>
</body>
</html>
